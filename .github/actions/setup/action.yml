---
name: OpenStreamDeck toolchain
description: >-
  Pinned Bun and Rust, locked dependencies, and native build prerequisites
inputs:
  save-cargo-cache:
    description: Save compilation cache after the job; false restores only
    required: false
    default: 'true'
  configure-updater-checks:
    description: Supply disposable updater variables for ordinary CI checks
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - name: Install Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
          libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev \
          libdbus-1-dev libxkbcommon-dev libxdo-dev libssl-dev
    - name: Read Rust toolchain configuration
      id: rust
      shell: bash
      run: |
        bun -e '
          const config = Bun.TOML.parse(
            await Bun.file("rust-toolchain.toml").text());
          console.log(`toolchain=${config.toolchain.channel}`);
          console.log(`components=${config.toolchain.components.join(",")}`);
        ' >> "$GITHUB_OUTPUT"
    - name: Install Rust and Cargo
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ steps.rust.outputs.toolchain }}
        components: ${{ steps.rust.outputs.components }}
    - uses: Swatinem/rust-cache@v2
      with:
        # Share Linux artifacts with Prek; only complete matrix jobs write them.
        shared-key: native-${{ runner.os }}-${{ runner.arch }}
        save-if: ${{ inputs.save-cargo-cache }}
    - name: Install locked frontend dependencies
      shell: bash
      run: bun ci
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.26.0
    - name: Install native Tauri CLI
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        cargo binstall --locked --no-confirm --disable-strategies compile
        tauri-cli
    - name: Configure disposable updater environment for checks
      if: inputs.configure-updater-checks == 'true'
      shell: bash
      run: |
        updater_dir=$(mktemp -d "$RUNNER_TEMP/updater-check.XXXXXX")
        updater_key="$updater_dir/check.key"
        updater_log="$updater_dir/generate.log"
        cleanup_updater_key() {
          rm -f "$updater_key" "$updater_key.pub" "$updater_log"
          rmdir "$updater_dir"
        }
        trap cleanup_updater_key EXIT
        if ! cargo tauri signer generate --ci -p ci-disposable \
          -w "$updater_key" > "$updater_log" 2>&1; then
          echo "Failed to generate disposable updater key." >&2
          exit 1
        fi
        updater_public_key=$(tr -d '\r\n' < "$updater_key.pub")
        updater_private_key=$(tr -d '\r\n' < "$updater_key")
        {
          echo "TAURI_SIGNING_PUBLIC_KEY=$updater_public_key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$updater_private_key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=ci-disposable"
        } >> "$GITHUB_ENV"
