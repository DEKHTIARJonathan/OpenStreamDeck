---
name: OpenStreamDeck toolchain
description: >-
  Pinned Bun and Rust, locked dependencies, and native build prerequisites
inputs:
  save-cargo-cache:
    description: Save compilation cache after the job; false restores only
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - name: Install Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
          libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev \
          libdbus-1-dev libxkbcommon-dev libxdo-dev libssl-dev
    - name: Install pinned Rust with formatting and linting
      shell: bash
      run: |
        toolchain=$(bun -e '
          const config = Bun.TOML.parse(
            await Bun.file("rust-toolchain.toml").text());
          process.stdout.write(config.toolchain.channel);')
        rustup toolchain install "$toolchain" --profile minimal \
          --component rustfmt --component clippy
    - uses: Swatinem/rust-cache@v2
      with:
        # Share Linux artifacts with Prek; only complete matrix jobs write them.
        shared-key: native-${{ runner.os }}-${{ runner.arch }}
        save-if: ${{ inputs.save-cargo-cache }}
    - name: Install locked frontend dependencies
      shell: bash
      run: bun ci
